<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org Flow · harness</title>
<style>
/* Paperclip host theme variables, copied from the host CSS (ui-dist/assets/index-*.css). */
@font-face{font-family:"InterVariable";src:url("/fonts/InterVariable.woff2") format("woff2");font-weight:100 900;font-display:block}
:root,:host{--font-sans:"InterVariable","Inter",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--font-mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace}
:root{--radius:.5rem;--background:oklch(100% 0 0);--foreground:oklch(14.5% 0 0);--card:oklch(100% 0 0);--card-foreground:oklch(14.5% 0 0);--popover:oklch(100% 0 0);--popover-foreground:oklch(14.5% 0 0);--primary:oklch(20.5% 0 0);--primary-foreground:oklch(98.5% 0 0);--secondary:oklch(97% 0 0);--secondary-foreground:oklch(20.5% 0 0);--muted:oklch(97% 0 0);--muted-foreground:oklch(55.6% 0 0);--accent:oklch(97% 0 0);--accent-foreground:oklch(20.5% 0 0);--destructive:oklch(57.7% .245 27.325);--destructive-foreground:oklch(98.5% 0 0);--border:oklch(92.2% 0 0);--input:oklch(92.2% 0 0);--ring:oklch(70.8% 0 0);--sidebar:oklch(98.5% 0 0);--sidebar-foreground:oklch(14.5% 0 0);--sidebar-primary:oklch(20.5% 0 0);--sidebar-primary-foreground:oklch(98.5% 0 0);--sidebar-accent:oklch(88% 0 0);--sidebar-accent-foreground:oklch(20.5% 0 0);--sidebar-border:oklch(92.2% 0 0);--sidebar-ring:oklch(70.8% 0 0);color-scheme:light}
.dark{--background:oklch(20.5% 0 0);--foreground:oklch(98.5% 0 0);--card:oklch(20.5% 0 0);--card-foreground:oklch(98.5% 0 0);--popover:oklch(20.5% 0 0);--popover-foreground:oklch(98.5% 0 0);--primary:oklch(92.2% 0 0);--primary-foreground:oklch(20.5% 0 0);--secondary:oklch(26.9% 0 0);--secondary-foreground:oklch(98.5% 0 0);--muted:oklch(26.9% 0 0);--muted-foreground:oklch(70.8% 0 0);--accent:oklch(26.9% 0 0);--accent-foreground:oklch(98.5% 0 0);--destructive:oklch(63.7% .237 25.331);--destructive-foreground:oklch(98.5% 0 0);--border:oklch(100% 0 0/.1);--input:oklch(100% 0 0/.15);--ring:oklch(55.6% 0 0);--sidebar:oklch(20.5% 0 0);--sidebar-foreground:oklch(98.5% 0 0);--sidebar-primary:oklch(48.8% .243 264.376);--sidebar-primary-foreground:oklch(98.5% 0 0);--sidebar-accent:oklch(32% 0 0);--sidebar-accent-foreground:oklch(98.5% 0 0);--sidebar-border:oklch(100% 0 0/.1);--sidebar-ring:oklch(55.6% 0 0);color-scheme:dark}
html,body{margin:0;min-height:100%}
body{background-color:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased;font-family:var(--font-sans)}
/* fake dashboard (widget view) */
.hx-dash{display:flex;min-height:100vh}
.hx-side{width:240px;flex:none;background:var(--sidebar);border-right:1px solid var(--sidebar-border);padding:16px 0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.hx-side-item{margin:0 8px;padding:6px 8px;border-radius:8px;color:color-mix(in oklch,var(--foreground) 80%,transparent);font-weight:500}
.hx-cards{flex:1;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:16px;align-content:start}
.hx-card{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:16px}
.hx-ghost{color:var(--muted-foreground);font-size:13px;min-height:160px}
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/harness.js"></script>
</body>
</html>
