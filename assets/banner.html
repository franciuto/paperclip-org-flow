<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Org Flow banner</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:480px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
    background:radial-gradient(900px 520px at 12% 0%,#2b3a67 0,#14182b 58%,#0d1020 100%);color:#fff;position:relative}
  .txt{position:absolute;left:96px;top:0;height:480px;width:520px;display:flex;flex-direction:column;justify-content:center}
  h1{font-size:96px;letter-spacing:-.035em;font-weight:700;line-height:1}
  p{margin-top:22px;font-size:27px;line-height:1.35;color:#c9d1ee;max-width:470px}
  .tag{margin-top:30px;align-self:flex-start;font-size:17px;letter-spacing:.09em;text-transform:uppercase;color:#9fb1ff;border:1px solid #3b4a85;border-radius:999px;padding:7px 16px}
  svg{position:absolute;right:0;top:0}
</style></head><body>
<div class="txt"><h1>Org Flow</h1><p>The live org chart for Paperclip: who is doing what, and how far along it is.</p><span class="tag">Plugin for Paperclip</span></div>
<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract org chart with a task handed from one person to another">
  <defs>
    <linearGradient id="gc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A5C"/><stop offset="1" stop-color="#E5436B"/></linearGradient>
    <linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA"/><stop offset="1" stop-color="#5B6BFF"/></linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B8F36B"/><stop offset="1" stop-color="#27C6A0"/></linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC857"/><stop offset="1" stop-color="#FF7A3D"/></linearGradient>
    <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9BD2"/><stop offset="1" stop-color="#C86BFF"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <g id="face"><circle cx="-7" cy="-2" r="2.4" fill="#1b1030"/><circle cx="7" cy="-2" r="2.4" fill="#1b1030"/><path d="M-5 5 Q0 10 5 5" stroke="#1b1030" stroke-width="2.2" stroke-linecap="round"/></g>
    <g id="sleep"><path d="M-9 -2 Q-7 0 -5 -2 M5 -2 Q7 0 9 -2" stroke="#1b1030" stroke-width="2.2" stroke-linecap="round"/><path d="M-4 6 H4" stroke="#1b1030" stroke-width="2.2" stroke-linecap="round"/></g>
  </defs>

  <!-- departments -->
  <g fill="#ffffff" fill-opacity=".05" stroke="#4a5a99" stroke-opacity=".6" stroke-dasharray="5 6">
    <rect x="40" y="176" width="268" height="250" rx="22"/>
    <rect x="326" y="176" width="150" height="250" rx="22"/>
    <rect x="494" y="176" width="268" height="250" rx="22"/>
  </g>
  <g fill="#9fb1ff" fill-opacity=".7"><rect x="62" y="194" width="62" height="7" rx="3.5"/><rect x="348" y="194" width="46" height="7" rx="3.5"/><rect x="516" y="194" width="70" height="7" rx="3.5"/></g>

  <!-- connectors -->
  <g stroke="#4a5a99" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M400 112 V150 M174 150 H628 M174 150 V236 M401 150 V236 M628 150 V236"/>
    <path d="M174 272 V300 M110 300 H238 M110 300 V324 M238 300 V324"/>
    <path d="M401 272 V324"/>
    <path d="M628 272 V300 M566 300 H690 M566 300 V324 M690 300 V324"/>
  </g>

  <!-- handoff: dotted arc and flying chip -->
  <path d="M262 318 C 300 232, 372 232, 392 318" stroke="#FFC857" stroke-width="2.6" stroke-dasharray="1 8" stroke-linecap="round"/>
  <g transform="translate(327 252)">
    <rect x="-34" y="-12" width="68" height="24" rx="12" fill="#FFC857" opacity=".28" filter="url(#glow)"/>
    <rect x="-32" y="-11" width="64" height="22" rx="11" fill="#171c33" stroke="#FFC857" stroke-width="2"/>
    <rect x="-27" y="-6" width="30" height="12" rx="6" fill="#FFC857"/><rect x="7" y="-3" width="14" height="6" rx="3" fill="#FFC857" opacity=".55"/>
  </g>

  <!-- root (board) -->
  <circle cx="400" cy="86" r="30" fill="#ffffff" fill-opacity=".08" stroke="#8fa0ee" stroke-width="2.4" stroke-dasharray="4 5"/>
  <circle cx="400" cy="79" r="8" fill="#c9d1ee"/><path d="M384 102 Q400 84 416 102" fill="#c9d1ee"/>

  <!-- level 2 -->
  <g transform="translate(174 254)"><path d="M-26 20 V-2 A26 26 0 0 1 26 -2 V20 Z" fill="url(#gc)"/><use href="#face" y="2"/></g>
  <g transform="translate(401 254)"><path d="M-26 20 V-2 A26 26 0 0 1 26 -2 V20 Z" fill="url(#gv)"/><use href="#face" y="2"/></g>
  <g transform="translate(628 254)"><path d="M-26 20 V-2 A26 26 0 0 1 26 -2 V20 Z" fill="url(#gl)"/><use href="#face" y="2"/></g>

  <!-- level 3 -->
  <g transform="translate(110 346)"><path d="M-23 18 V-2 A23 23 0 0 1 23 -2 V18 Z" fill="url(#gp)"/><use href="#face" y="2"/></g>
  <g transform="translate(238 346)"><path d="M-23 18 V-2 A23 23 0 0 1 23 -2 V18 Z" fill="url(#gt)"/><use href="#face" y="2"/></g>
  <g transform="translate(401 346)"><path d="M-23 18 V-2 A23 23 0 0 1 23 -2 V18 Z" fill="url(#gc)"/><use href="#face" y="2"/></g>
  <g transform="translate(566 346)" opacity=".85"><path d="M-23 18 V-2 A23 23 0 0 1 23 -2 V18 Z" fill="url(#gv)"/><use href="#sleep" y="2"/></g>
  <g fill="#9fb1ff" font-family="Inter,Segoe UI,sans-serif" font-weight="700"><text x="586" y="318" font-size="15">z</text><text x="598" y="304" font-size="11">z</text></g>
  <g transform="translate(690 346)"><path d="M-23 18 V-2 A23 23 0 0 1 23 -2 V18 Z" fill="url(#gl)"/><use href="#face" y="2"/></g>

  <!-- task chips under people (progress fill) -->
  <g>
    <rect x="80" y="382" width="60" height="18" rx="9" fill="#171c33" stroke="#C86BFF" stroke-width="1.8"/><rect x="83" y="385" width="38" height="12" rx="6" fill="#C86BFF"/>
    <rect x="208" y="382" width="60" height="18" rx="9" fill="#171c33" stroke="#FFC857" stroke-width="1.8"/><rect x="211" y="385" width="14" height="12" rx="6" fill="#FFC857"/>
    <rect x="371" y="382" width="60" height="18" rx="9" fill="#171c33" stroke="#FF8A5C" stroke-width="1.8"/><rect x="374" y="385" width="46" height="12" rx="6" fill="#FF8A5C"/>
    <rect x="660" y="382" width="60" height="18" rx="9" fill="#171c33" stroke="#27C6A0" stroke-width="1.8"/><rect x="663" y="385" width="54" height="12" rx="6" fill="#27C6A0"/>
  </g>
</svg>
</body></html>
