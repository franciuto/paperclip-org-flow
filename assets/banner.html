<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Org Flow banner</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{width:1440px;height:480px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",sans-serif;
    background:radial-gradient(900px 500px at 15% 10%,#2b3a67 0,#14182b 60%,#0d1020 100%);color:#fff;display:flex;align-items:center;padding:0 90px;gap:70px}
  .txt{flex:0 0 520px}
  h1{font-size:92px;letter-spacing:-.03em;font-weight:700;line-height:1}
  p{margin-top:22px;font-size:27px;line-height:1.35;color:#c9d1ee;max-width:480px}
  .tag{margin-top:30px;display:inline-block;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:#9fb1ff;border:1px solid #3b4a85;border-radius:999px;padding:7px 16px}
  .shot{flex:1;height:360px;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.55);border:1px solid #3b4a85;background:#fff;position:relative}
  .shot img{width:1100px;position:absolute;left:-150px;top:-95px}
</style></head><body>
<div class="txt"><h1>Org Flow</h1><p>The live org chart for Paperclip: who is doing what, and how far along it is.</p><span class="tag">Plugin for Paperclip</span></div>
<div class="shot"><img src="demo/busy-light.png" alt=""></div>
</body></html>
